<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #f1f1f1;
            color: #222;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .author-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            opacity: 0.6;
        }

        .input-panel {
            padding: 20px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: #f4f4f4;
            padding: 8px 12px;
            border-radius: 25px;
            border: 1px solid #ddd;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="chat-log">
        <div class="message ai-message">
            <span class="author-label">AI Ассистент</span>
            Здравствуйте! Чем я могу вам помочь сегодня?
        </div>
    </div>

    <div class="input-panel">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Напишите сообщение..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Вставлена ваша тестовая ссылка n8n:
    const WEBHOOK_URL = "https://n8n.2gis.io/webhook-test/c1a01916-d6ee-478a-82ff-c2910194976c";

    function createMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}-message`;

        const label = role === 'user' ? 'Вы' : 'AI Ассистент';

        messageDiv.innerHTML = `
            <span class="author-label">${label}</span>
            <div>${text}</div>
        `;

        chatLog.appendChild(messageDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        createMessage('user', text);
        userInput.value = '';

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            // Код ожидает от n8n поле "reply" или "answer"
            createMessage('ai', data.reply || data.answer || "Нет ответа от сервера.");

        } catch (error) {
            console.error(error);
            createMessage('ai', "Ошибка соединения с сервером.");
        }
    }

    sendBtn.addEventListener('click', handleSend);

    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleSend();
        }
    });

});
</script>

</body>
</html>
